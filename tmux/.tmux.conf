# ----- Prefix -----
# Use Ctrl-a instead of Ctrl-b (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ----- Session Persistence -----
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ----- Usability -----
set -g mouse on
set -sg escape-time 0
set -g history-limit 50000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# ----- Intuitive Splits -----
# | for vertical, - for horizontal (opens in same directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ----- Theme (black/orange — matches Hyprland STYLEGUIDE.md) -----
# Status bar
set -g status-style "bg=#0a0a0a,fg=#666666"
set -g status-left "#[fg=#d4d4d4,bold] #S #[fg=#666666,nobold]│ "
set -g status-right "#[fg=#666666]%H:%M  #h "
set -g status-left-length 30
set -g status-right-length 40

# Window tabs
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#d4d4d4,bold] #I:#W #[fg=#666666,nobold]"
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#ffa032"

# Messages and command prompt
set -g message-style "bg=#0a0a0a,fg=#ffa032"
set -g mode-style "bg=#0a0a0a,fg=#ffa032"

# ----- Cheat Sheet on Startup -----
set-hook -g session-created 'split-window -h -l 60 "cat ~/.tmux-cheatsheet.txt; read"'

# ----- Load Plugins -----
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
