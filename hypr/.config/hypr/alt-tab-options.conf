# Alt+Tab / workspace experiments.
#
# Option A: workspace previous (pairwise desktop switching)
#   SUPER + Tab
#
# Option B: window Alt+Tab in focus-history order
#   ALT + Tab / ALT + SHIFT + Tab
#
# Option C: workspace list in MRU order (rofi picker)
#   SUPER + SHIFT + Tab

# Option A: previous workspace on focused monitor
bind = $mainMod, Tab, workspace, previous_per_monitor

# Option B: windows MRU behavior
bind = ALT, Tab, cyclenext, hist next
bind = ALT, Tab, alterzorder, top
bind = ALT SHIFT, Tab, cyclenext, prev hist
bind = ALT SHIFT, Tab, alterzorder, top

# Option C: workspace MRU menu
bind = $mainMod SHIFT, Tab, exec, ~/.config/hypr/scripts/workspace-mru-menu.sh
