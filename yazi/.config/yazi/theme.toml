# Yazi theme — black/orange matching Hyprland STYLEGUIDE.md

[mgr]
cwd              = { fg = "#ffa032" }
find_keyword     = { fg = "#ffa032", bold = true }
find_position    = { fg = "#d4d4d4", italic = true }
symlink_target   = { fg = "#666666", italic = true }
marker_copied    = { fg = "#ffa032", bg = "#ffa032" }
marker_cut       = { fg = "#cc4444", bg = "#cc4444" }
marker_marked    = { fg = "#ffa032", bg = "#ffa032" }
marker_selected  = { fg = "#ffa032", bg = "#ffa032" }
count_copied     = { fg = "#0a0a0a", bg = "#ffa032" }
count_cut        = { fg = "#0a0a0a", bg = "#cc4444" }
count_selected   = { fg = "#0a0a0a", bg = "#88bb88" }
border_symbol    = "│"
border_style     = { fg = "#333333" }

[indicator]
parent  = { fg = "#333333" }
current = { fg = "#d4d4d4" }
preview = { fg = "#333333" }

[tabs]
active   = { fg = "#0a0a0a", bg = "#ffa032", bold = true }
inactive = { fg = "#666666", bg = "#1a1a1a" }

[mode]
normal_main = { fg = "#0a0a0a", bg = "#ffa032", bold = true }
normal_alt  = { fg = "#ffa032", bg = "#1a1a1a" }
select_main = { fg = "#0a0a0a", bg = "#88bb88", bold = true }
select_alt  = { fg = "#88bb88", bg = "#1a1a1a" }
unset_main  = { fg = "#0a0a0a", bg = "#cc4444", bold = true }
unset_alt   = { fg = "#cc4444", bg = "#1a1a1a" }

[status]
overall        = { bg = "#0a0a0a" }
perm_type      = { fg = "#ffa032" }
perm_read      = { fg = "#d4d4d4" }
perm_write     = { fg = "#ffa032" }
perm_exec      = { fg = "#88bb88" }
perm_sep       = { fg = "#333333" }
progress_label = { fg = "#d4d4d4", bold = true }
progress_normal = { fg = "#ffa032" }
progress_error  = { fg = "#cc4444" }

[input]
border   = { fg = "#ffa032" }
title    = { fg = "#d4d4d4" }
value    = { fg = "#d4d4d4" }
selected = { fg = "#0a0a0a", bg = "#ffa032" }

[confirm]
border   = { fg = "#ffa032" }
title    = { fg = "#d4d4d4" }
body     = { fg = "#666666" }
list     = { fg = "#d4d4d4" }
btn_yes  = { fg = "#0a0a0a", bg = "#88bb88", bold = true }
btn_no   = { fg = "#0a0a0a", bg = "#cc4444", bold = true }

[pick]
border   = { fg = "#ffa032" }
active   = { fg = "#d4d4d4", bold = true }
inactive = { fg = "#666666" }

[which]
cols            = 3
mask            = { bg = "#0a0a0a" }
cand            = { fg = "#ffa032" }
rest            = { fg = "#333333" }
desc            = { fg = "#d4d4d4" }
separator       = " → "
separator_style = { fg = "#333333" }

[cmp]
border   = { fg = "#ffa032" }
active   = { fg = "#d4d4d4", bg = "#1a1a1a" }
inactive = { fg = "#666666" }

[tasks]
border  = { fg = "#ffa032" }
title   = { fg = "#d4d4d4" }
hovered = { fg = "#0a0a0a", bg = "#ffa032" }

[help]
on      = { fg = "#ffa032" }
run     = { fg = "#d4d4d4" }
desc    = { fg = "#666666" }
hovered = { fg = "#0a0a0a", bg = "#ffa032" }
footer  = { fg = "#333333" }

[notify]
title_info  = { fg = "#88bb88" }
title_warn  = { fg = "#ffa032" }
title_error = { fg = "#cc4444" }

[filetype]
rules = [
    { url = "*/",                 fg = "#ffa032", bold = true },
    { mime = "image/*",           fg = "#d4d4d4" },
    { mime = "{audio,video}/*",   fg = "#666666" },
    { mime = "application/zip",   fg = "#cc4444" },
    { is = "link",                fg = "#666666", italic = true },
    { is = "orphan",              fg = "#cc4444", italic = true },
    { is = "exec",                fg = "#88bb88" },
    { name = "*",                  fg = "#d4d4d4" },
]
